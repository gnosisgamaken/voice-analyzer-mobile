# Dependency Review
# This workflow runs on pull requests to check for vulnerable dependencies

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Deny list of package URLs
          deny-licenses: GPL-3.0, AGPL-3.0
