name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

jobs:
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-14 # Latest macOS with Xcode 15+
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro Installation
        run: maestro --version

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build iOS App for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/voiceanalyzermobile.xcworkspace \
            -scheme voiceanalyzermobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
            | xcpretty --color

      - name: Start Metro Bundler
        run: |
          npm start &
          sleep 10
        env:
          CI: true

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl bootstatus "iPhone 15 Pro"

      - name: Install App on Simulator
        run: |
          xcrun simctl install booted ios/build/Build/Products/Debug-iphonesimulator/voiceanalyzermobile.app

      - name: Run Maestro Tests
        run: |
          maestro test .maestro/ \
            --format junit \
            --output test-results/maestro/junit.xml
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: maestro-test-results
          path: test-results/

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests/**/*.png

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/maestro/junit.xml'
          check_name: 'E2E Test Results'
          fail_on_failure: true

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/maestro/junit.xml';
            
            if (fs.existsSync(path)) {
              const results = fs.readFileSync(path, 'utf8');
              // Parse and format results (simplified)
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## E2E Test Results\n\nMaestro tests completed. Check the workflow logs for details.`
              });
            }
